server.port=8080
# Optional servlet context path, e.g. /api/v1 — keep empty for backward compatibility.
# When set, frontend VITE_API_BASE_URL must include this prefix (e.g. http://localhost:8080/api/v1).
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

# =========================
# Database Config (PostgreSQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mockserver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mock_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mock_password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Hibernate Logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# =========================
# Jackson
# =========================
spring.jackson.serialization.INDENT_OUTPUT=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# =========================
# Swagger
# =========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# Mock Server Config
# =========================
mockserver.logs.maxEntries=5000
mockserver.auth.enabled=${MOCKSERVER_AUTH_ENABLED:false}
mockserver.demo.seed=${MOCKSERVER_DEMO_SEED:true}

# =========================
# JWT Config
# =========================
mockserver.auth.jwt.secret=${MOCKSERVER_JWT_SECRET:thisIsMySuperLongAndSecureSecretKeyForJWT1234567890ABCDEF}
mockserver.auth.jwt.ttlSeconds=86400

# =========================
# HikariCP Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000

# =========================
# Actuator (Health + Metrics)
# =========================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# =========================
# Performance Tuning
# =========================
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# =========================
# Redis Config (Docker: redis service)
# =========================
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000