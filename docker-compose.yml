version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mock_user
      POSTGRES_PASSWORD: mock_password
      POSTGRES_DB: mockserver
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_user -d mockserver"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mock_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mock-server-backend
      dockerfile: Dockerfile
    container_name: mock_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mockserver
      - SPRING_DATASOURCE_USERNAME=mock_user
      - SPRING_DATASOURCE_PASSWORD=mock_password
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - MOCKSERVER_AUTH_ENABLED=false
      - MOCKSERVER_DEMO_SEED=true
      # Optional: nest whole app under a prefix
      # - SERVER_SERVLET_CONTEXT_PATH=/api/v1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./mock-server-frontend
      dockerfile: Dockerfile
    container_name: mock_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
