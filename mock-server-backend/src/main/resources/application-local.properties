# ================================================
# Mock Server — LOCAL Profile (application-local.properties)
# ================================================
# Activate with: --spring.profiles.active=local
# or set env: SPRING_PROFILES_ACTIVE=local

server.port=8080

# =========================
# Database — Local PostgreSQL (native install)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/mockserver
spring.datasource.username=mock_user
spring.datasource.password=mock_password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show SQL in console for local debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================
# Redis — Local Redis
# =========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# =========================
# Jackson
# =========================
spring.jackson.serialization.INDENT_OUTPUT=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# =========================
# Multipart (form-data) Support
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# Mock Server Config
# =========================
mockserver.logs.maxEntries=5000
mockserver.auth.enabled=false
mockserver.demo.seed=true

# =========================
# JWT Config
# =========================
mockserver.auth.jwt.secret=localDevSecretKeyForTestingOnlyDoNotUseInProduction12345
mockserver.auth.jwt.ttlSeconds=86400

# =========================
# HikariCP Connection Pool (lighter for local)
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# =========================
# Logging — verbose for local dev
# =========================
logging.level.com.telecom.mockserver=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
