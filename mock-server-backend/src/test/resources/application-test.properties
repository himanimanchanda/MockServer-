# Test slice: fast in-memory DB, no Redis (see profile "test" + TestSimpleCacheConfig / CacheConfig profiles)
spring.datasource.url=jdbc:h2:mem:mocksrv;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable demo seeding in tests
mockserver.demo.seed=false

# Disable auth in tests — permits all requests
mockserver.auth.enabled=false

# Disable Envers auditing in tests to avoid H2 compatibility issues
spring.jpa.properties.hibernate.envers.autoRegisterListeners=false

# Use in-memory cache (TestSimpleCacheConfig handles this via @Profile("test"))
spring.cache.type=simple
