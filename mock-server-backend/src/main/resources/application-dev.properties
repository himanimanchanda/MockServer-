# ================================================
# Mock Server — DEV Profile (application-dev.properties)
# ================================================
# Activate with: --spring.profiles.active=dev
# or set env: SPRING_PROFILES_ACTIVE=dev
# This is the profile used in Docker / deployed environments.

server.port=8080

# =========================
# Database — Docker PostgreSQL service
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mockserver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mock_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mock_password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable verbose Hibernate logging in dev/deployed
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# =========================
# Redis — Docker Redis service
# =========================
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# =========================
# Jackson
# =========================
spring.jackson.serialization.INDENT_OUTPUT=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# =========================
# Mock Server Config
# =========================
mockserver.logs.maxEntries=5000
mockserver.auth.enabled=${MOCKSERVER_AUTH_ENABLED:false}
mockserver.demo.seed=${MOCKSERVER_DEMO_SEED:false}

# =========================
# JWT Config
# =========================
mockserver.auth.jwt.secret=${MOCKSERVER_JWT_SECRET:thisIsMySuperLongAndSecureSecretKeyForJWT1234567890ABCDEF}
mockserver.auth.jwt.ttlSeconds=86400

# =========================
# HikariCP Connection Pool (production-grade)
# =========================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=60000

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# =========================
# Performance Tuning
# =========================
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# =========================
# Logging — production-lean
# =========================
logging.level.com.telecom.mockserver=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
